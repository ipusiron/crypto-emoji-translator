<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="文字を絵文字に置き換える">
  <rect width="32" height="32" rx="7" fill="#0b0c10"/>
  <!-- 左の列＝A–Zの文字（白い四角） -->
  <g fill="#e0e0e0">
    <rect x="5" y="6" width="6" height="6" rx="1.5"/>
    <rect x="5" y="13" width="6" height="6" rx="1.5"/>
    <rect x="5" y="20" width="6" height="6" rx="1.5"/>
  </g>
  <!-- 右の列＝置き換えた先の絵文字（色のついた丸） -->
  <circle cx="24" cy="9" r="3" fill="#4fc3f7"/>
  <circle cx="24" cy="16" r="3" fill="#81c784"/>
  <circle cx="24" cy="23" r="3" fill="#ffb74d"/>
  <!-- 対応を示す線 -->
  <g stroke="#55657d" stroke-width="1.6" stroke-linecap="round">
    <line x1="12.5" y1="9" x2="19.5" y2="9"/>
    <line x1="12.5" y1="16" x2="19.5" y2="16"/>
    <line x1="12.5" y1="23" x2="19.5" y2="23"/>
  </g>
</svg>
